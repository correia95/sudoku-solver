    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Sudoku Solver",
        "url": "https://sudoku-solver.correia95.workers.dev/",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "Solves any 9x9 Sudoku puzzle using a backtracking search with a minimum-remaining-values heuristic. Detects digits that conflict in a row, column or box as they're entered, and checks whether the entered puzzle has exactly one solution. Runs entirely in the browser."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How does the solver work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It uses backtracking search with a minimum-remaining-values heuristic: it always fills the empty square with the fewest legal digits left, and backs up whenever a choice leads to a dead end. This solves almost any Sudoku, including very hard ones, in a fraction of a second."
            }
          },
          {
            "@type": "Question",
            "name": "What is the minimum number of clues for a valid Sudoku?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "17. It has been proven by exhaustive computer search that no 9x9 Sudoku with fewer than 17 given digits has exactly one solution."
            }
          },
          {
            "@type": "Question",
            "name": "Can I paste a puzzle instead of typing it in?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Paste 81 characters using 1 to 9 for a given digit and 0 or a period for a blank cell; line breaks and other punctuation used to format the grid are ignored."
            }
          },
          {
            "@type": "Question",
            "name": "Is my puzzle uploaded anywhere?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Everything runs in your browser with no server and no network requests, which you can verify in your browser's developer tools."
            }
          }
        ]
      }
    </script>
